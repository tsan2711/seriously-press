# Nguồn bổ sung (2026-11-23, task sources-more): chỉ feed RSS/Atom chính thức của chính nhà xuất bản.
# Mỗi ban ≥ 8 nguồn. Mỗi nguồn tối đa PER_FEED=4 bài/ngày (press.py) để không nguồn nào lấn át.

# ---- gamedev ----
[[feed]]
desk = "gamedev"
id = "gamedev-net"
name = "Gamedev.net"
url = "https://www.gamedev.net/rss/"
# lý do: cộng đồng lập trình game lâu đời, bài kỹ thuật
[[feed]]
desk = "gamedev"
id = "eighty-lv"
name = "80 Level"
url = "https://80.lv/feed/"
# lý do: quy trình art/kỹ thuật game thực chiến
[[feed]]
desk = "gamedev"
id = "gdc-vault"
name = "GDC"
url = "https://gdcvault.com/rss"
# lý do: bài giảng GDC chính chủ

