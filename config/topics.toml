# Đồ thị chủ đề (spec §2). Mỗi chủ đề: tên hiển thị, từ khoá khớp (không phân biệt hoa thường), chủ đề kề (cho khám phá M4), ngành.
# Thêm chủ đề = thêm một khối. Không sửa mã.
[topic.roguelike]
label = "Roguelike"
kw = ["roguelike", "roguelite", "rogue-lite"]
